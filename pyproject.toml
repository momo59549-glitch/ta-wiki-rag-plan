[project]
name = "ta-wiki-rag"
version = "0.1.0"
description = "可追溯、可解释、可验证的技术分析知识与研究平台"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pandas>=2.2,<4.0",
  "pyarrow>=16,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
research = [
  "vectorbt>=0.26,<0.28",
  "skfolio>=0.10,<1.0",
  "statsmodels>=0.14,<0.15",
  "backtrader>=1.9.78.123,<2.0",
  "tushare>=1.4,<2.0",
]
orchestration = [
  "prefect>=3.4,<4.0",
  "langgraph>=1.0,<2.0",
]
ui = [
  "streamlit>=1.45,<2.0",
  "httpx>=0.28,<1.0",
]
knowledge = [
  "llama-index-core>=0.12,<1.0",
  "llama-index-retrievers-bm25>=0.5,<1.0",
  "anthropic>=0.49,<1.0",
  "pypdf>=5.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
