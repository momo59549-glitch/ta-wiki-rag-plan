[project]
name = "ta-wiki-rag"
version = "0.1.0"
description = "可追溯、可解释、可验证的技术分析知识与研究平台"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pandas>=2.2,<4.0",
  "pyarrow>=16,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
