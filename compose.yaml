services:
  api:
    build: .
    command: ["python", "-m", "uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TA_API_KEY: ${TA_API_KEY:?TA_API_KEY is required}
      TA_RESEARCH_DATA_ROOT: /app/data
      TA_RESEARCH_CASE_ROOT: /app/data/research_cases
    volumes:
      - ./data:/app/data
      - ${MODEL_DATA_PATH:?MODEL_DATA_PATH is required}:/model-data:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "apps/research_ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      TA_API_URL: http://api:8000
      TA_API_KEY: ${TA_API_KEY:?TA_API_KEY is required}
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "scripts/run_file_worker.py", "--control-root", "/app/data/control", "--worker-id", "compose-worker"]
    volumes:
      - ./data:/app/data
      - ${MODEL_DATA_PATH:?MODEL_DATA_PATH is required}:/model-data:ro
    environment:
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TA_PROJECT_ROOT: /app
      TA_MODEL_DATA_ROOT: /model-data
    depends_on:
      api:
        condition: service_healthy
  prefect:
    build: .
    command: ["python", "-m", "prefect", "server", "start", "--host", "0.0.0.0"]
    volumes:
      - prefect-data:/root/.prefect
    ports: ["127.0.0.1:4200:4200"]
volumes:
  prefect-data:
